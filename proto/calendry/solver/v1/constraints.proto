// Calendry solver — constraint catalogue.
//
// A catalogue of predefined constraint types, not a fixed count of them — it
// grows by addition (see the numbering note on `ConstraintConfig.params`
// below). Each type gets exactly ONE typed, compiled evaluator function in
// the solver, reading that type's typed parameters. There is no interpreter
// and no free-form expression language: tenant-supplied logic never executes.
//
// A type appearing here is not a promise the solver evaluates it yet: a few
// are staged schema-first, ahead of their evaluator, and say so in their own
// comment — check the solver repo's CLAUDE.md for what is actually built.
//
// Hard-vs-soft is a property of the TYPE, not of the config — it is compiled
// into the evaluator and cannot be flipped per tenant.

syntax = "proto3";

package calendry.solver.v1;

// ---------------------------------------------------------------------------
// Wrapper
// ---------------------------------------------------------------------------

message ConstraintConfig {
  string id = 1;

  bool enabled = 2;

  // Which tenant-defined Offering/Session `kind`s this instance applies to.
  // Empty = all kinds. Required because a tenant-defined kind (e.g.
  // "staff_meeting") may have no Group at all, so group-based constraints
  // cannot be assumed universal.
  repeated string applies_to_kinds = 3;

  // Penalty weight. Meaningful for SOFT types only; ignored for HARD types.
  double weight = 4;

  oneof params {
    // -- Structural (double-booking) --
    RoomDoubleBooking     room_double_booking     = 10;
    LecturerDoubleBooking lecturer_double_booking = 11;
    GroupDoubleBooking    group_double_booking    = 12;

    // -- Hard --
    ExactFrequency      exact_frequency        = 13;
    LecturerVeto        lecturer_veto          = 14;
    OnlineOnsiteSameDay online_onsite_same_day = 15;
    MaxOnlineShare      max_online_share       = 16;

    // Structural, added after the initial band assignment — numbered out of
    // band deliberately rather than renumbering already-approved fields.
    PersonDoubleBooking person_double_booking = 17;

    // -- Soft --
    MinimizeFirstBlock minimize_first_block = 20 [deprecated = true];
    MinimizeLastBlock  minimize_last_block  = 21 [deprecated = true];
    MinimizeDayUsage   minimize_day_usage   = 22;
    MinimizeRoomRank   minimize_room_rank   = 23;
    MinimizeExamWeek   minimize_exam_week   = 24;
    MinimizeOnline     minimize_online      = 25;

    // Supersedes 20 and 21. Numbered after them rather than reusing either,
    // because a renumbered field silently changes meaning for any peer still
    // on the old schema.
    MinimizeBlockUsage minimize_block_usage = 26;

    PersonPreferenceFit person_preference_fit = 27;

    // Hard, numbered here rather than in the 13-17 band for the same reason
    // PersonDoubleBooking was: renumbering an approved field silently changes
    // its meaning for any peer still on the old schema.
    GroupVeto group_veto = 28;

    // `Compactness.scope` selects which axis (GROUP/PERSON, empty = both)
    // this instance's weight applies to.
    Compactness compactness = 29;

    LecturerConsistency lecturer_consistency = 30;

    // SOFT. Reads `Offering.scheduling_pattern` per Offering — this instance
    // only prices the Offerings tagged for its own pattern. Two separate
    // types rather than one parameterized by pattern (contrast
    // `Compactness`'s single type over GROUP/PERSON): the two patterns' cost
    // functions share nothing.
    DistributedPatternAdherence distributed_pattern_adherence = 31;
    BlockPatternAdherence       block_pattern_adherence        = 32;

    // -- P2 batch: room fit, day/week aggregates, tenant-wide policy --
    MinimizeCapacityWaste      minimize_capacity_waste       = 33;
    MinimizeLocationChange     minimize_location_change      = 34;
    MaxConsecutiveBlocks       max_consecutive_blocks        = 35;
    MaxWeeklyTeachingLoad      max_weekly_teaching_load      = 36;
    ExamSpacingSameDay         exam_spacing_same_day         = 37;
    ExamSpacingWindow          exam_spacing_window           = 38;
    ProtectedBlock             protected_block               = 39;
    RoomConsistency            room_consistency              = 40;
    MinimizeRoomChurn          minimize_room_churn           = 41;
    MaxDailySpan               max_daily_span                = 42;
    MinimizeWeekdayImbalance   minimize_weekday_imbalance    = 43;
    RoomTurnaroundBuffer       room_turnaround_buffer        = 44;
    MaxConcurrentOnlineSessions max_concurrent_online_sessions = 45;
    GroupSizeFitsRoom          group_size_fits_room          = 46;

    // Staged together for one version bump, same as the P2 batch above but
    // added afterward — numbered to continue that band rather than
    // renumbering anything already approved.
    MaxDailySessionCount       max_daily_session_count       = 47;

    // The (Offering, day) cluster — see the three messages' own section.
    MaxOfferingSessionsPerDay    max_offering_sessions_per_day    = 48;
    MaxConsecutiveOfferingBlocks max_consecutive_offering_blocks  = 49;
    MinimizeOfferingDaySplit     minimize_offering_day_split      = 50;

    // -- P0 batch: break-aware, per-Offering teaching mode, travel, day caps --
    MinimizeBreakSpanning        minimize_break_spanning         = 51;
    MinimizeOfferingDistinctDays minimize_offering_distinct_days = 52;
    TravelTimeBetweenRooms       travel_time_between_rooms       = 53;
    MaxDays                      max_days                        = 54;
    MaxConsecutiveDays           max_consecutive_days            = 55;
    Daybreak                     daybreak                        = 56;

    MinimizeSpecializedRoomUse   minimize_specialized_room_use   = 57;
  }
}

// ---------------------------------------------------------------------------
// Structural types (double-booking)
//
// The first three are already evaluated by the Nuxt app's manual-edit checker
// today. PersonDoubleBooking is NOT yet — see the cross-repo follow-up note in
// the solver repo's CLAUDE.md.
// ---------------------------------------------------------------------------

// HARD. A Room may host at most one Session per (week, day, block).
// Federation-owned Rooms additionally consider ExternalOccupancy supplied by
// the caller, so a shared resource is not double-booked across tenants.
message RoomDoubleBooking {}

// HARD. A Person assigned as Lecturer may lead at most one Session per slot.
message LecturerDoubleBooking {}

// HARD. A Group may attend at most one Session per slot. Conflicts propagate
// through the nested-group tree in BOTH directions: a Group is busy if itself,
// any ancestor, or any descendant is busy at that slot.
message GroupDoubleBooking {}

// HARD. A Person may attend at most one Session per slot, considering both
// direct individual assignment and Group membership.
//
// This catches a clash the Group check structurally cannot: a Person who is a
// member of two Groups that are UNRELATED in the nesting tree (neither is an
// ancestor or descendant of the other), both scheduled at the same slot.
message PersonDoubleBooking {}

// ---------------------------------------------------------------------------
// Hard types
// ---------------------------------------------------------------------------

// HARD. Each in-scope Offering must be realized by exactly
// `Offering.required_session_count` placed Sessions. No parameters — the
// count is Offering data, not constraint policy.
message ExactFrequency {}

// HARD. A Person is never assigned as Lecturer during one of their declared
// blackout windows. No parameters: the values live on `Person.blackouts` as
// per-person data; this config is tenant-level policy that switches
// enforcement on.
message LecturerVeto {}

// HARD. A Session is never placed during a blackout window of any Group
// attending it. Exactly the shape of LecturerVeto one entity across.
//
// "Attending it" resolves DOWNWARD through the hierarchy — a Group's blackout
// binds that Group and its descendants, never its ancestors.
message GroupVeto {}

// SOFT. A Group should not be asked to be on campus and online on the same
// day.
//
// WAS HARD — the solver used to eliminate a mixing placement in `is_free`; it
// now prices one on the objective, so a run may return a schedule that mixes
// when every alternative costs more. Reported in the objective breakdown, NOT
// as a hard violation.
message OnlineOnsiteSameDay {
  // FIELD 1 IS RESERVED AND UNUSED — nothing is missing here. The message is
  // deliberately empty: this type carries no parameters, and its penalty
  // weight rides on `ConstraintConfig.weight`. Field 1 is claimed now so a
  // future per-instance tuning knob is an ordinary field addition.
  reserved 1;
}

// HARD. At most `max_ratio` of a Group's Sessions may be online.
// (Was a hardcoded 30% in the TimeCraft prototype; now a parameter.)
message MaxOnlineShare {
  double max_ratio = 1; // 0.0 .. 1.0

  ShareWindow window = 2;
}

enum ShareWindow {
  SHARE_WINDOW_UNSPECIFIED = 0;
  SHARE_WINDOW_PER_TERM    = 1;
  SHARE_WINDOW_PER_WEEK    = 2;
}

// ---------------------------------------------------------------------------
// Soft types
// ---------------------------------------------------------------------------

// SOFT. Penalize Sessions in the first block of a day, resolved against the
// tenant's TimeGrid, never a fixed index.
//
// DEPRECATED: superseded by MinimizeBlockUsage (`first = true`). Retained
// because removing a field is wire-breaking; senders should emit
// MinimizeBlockUsage instead.
message MinimizeFirstBlock {
  option deprecated = true;
}

// SOFT. Penalize Sessions in the last block of a day. Generalizes the
// prototype's fixed "third block" via a per-tenant `blocks_per_day`.
//
// DEPRECATED: superseded by MinimizeBlockUsage (`last = true`). See above.
message MinimizeLastBlock {
  option deprecated = true;
}

// SOFT. Penalize Sessions in the listed block positions. Supersedes
// MinimizeFirstBlock/MinimizeLastBlock, and does for the BLOCK axis what
// MinimizeDayUsage does for the day axis.
//
// WHY BOTH A LIST AND TWO FLAGS: "first"/"last" are RELATIVE to
// `TimeGrid.blocks_per_day`; an index is ABSOLUTE. A school that extends its
// day still avoids "the last block" if the rule reads `last = true`, which an
// absolute index alone could not express across a grid resize.
//
// An index at or beyond `blocks_per_day` is inert, not an error: a grid may
// shrink under the tenant's own configuration.
message MinimizeBlockUsage {
  // 0-based block indices to penalize. May be empty when only the flags apply.
  repeated uint32 blocks = 1;

  bool first = 2; // penalize the day's first block, whichever index that currently is
  bool last  = 3; // penalize the day's last block, whichever index that currently is
}

// SOFT. Penalize Sessions on the listed weekdays. Generalizes the prototype's
// hardcoded "minimize Saturday" via tenant-configured `TimeGrid.active_days`.
message MinimizeDayUsage {
  repeated uint32 days = 1; // ISO weekday, 1 = Monday .. 7 = Sunday
}

// SOFT. Steer room choice by `Room.rank` (HIGHER = more premium/scarce).
// `invert` names which side of `rank_threshold` is penalized — both
// directions are real policies (keep the best halls free for events, or
// force them into use). One message with a direction flag rather than two
// types, since two types could both be enabled at once and contradict each
// other with nothing to prevent it.
message MinimizeRoomRank {
  uint32 rank_threshold = 1;

  // false (default) — penalize `rank >= rank_threshold`: spare the best rooms.
  // true            — penalize `rank <= rank_threshold`: prefer the best rooms.
  // Added in 0.5.0; absent decodes to false, unchanged from every prior peer.
  bool invert = 2;
}

// SOFT. Penalize Sessions falling in a week whose `WeekKind` is EXAM.
// Resolves against the structured Academic Calendar — the prototype's
// `weeks[-exam_weeks:]` slicing must not be reproduced.
message MinimizeExamWeek {
  // false (default) — penalize placing an ordinary Session in an EXAM week.
  // true            — invert: penalize NOT placing in an EXAM week, pushing
  // an exam-kind Session toward the exam period instead of away from it. Same
  // one-flag-not-two-types reasoning as `MinimizeRoomRank.invert`.
  //
  // PROTO ONLY. The solver does not yet read this field.
  bool invert = 1;
}

// SOFT. Penalize Sessions placed in a virtual (online) Room.
message MinimizeOnline {}

// SOFT. Reward placements landing in a Person's stated preferred days/blocks.
// The VALUES live on Person.preferred; this message is the tenant-level
// switch and, via Constraint.weight, how much the tenant cares — same
// architecture as LecturerVeto. A per-person weight override rides on
// Person.preferred.weight_multiplier instead, since Constraint carries ONE
// weight and there is no person axis to scope an instance by.
message PersonPreferenceFit {
  // Which role_tags' preferences are counted. Empty = lecturers only — a
  // Session's attendee set includes every Group member, so counting all of
  // them would let a large cohort's aggregate preference outweigh the person
  // actually teaching.
  repeated string roles = 1;
}

// SOFT. Minimize idle blocks between an attending Group's or Person's first
// and last Session of a day. Needs the WHOLE of one day's session set for one
// Group or Person at once, not a single placement's slot.
message Compactness {
  // Empty = both axes counted independently.
  repeated CompactnessScope scope = 1;
}

enum CompactnessScope {
  COMPACTNESS_SCOPE_UNSPECIFIED = 0;
  COMPACTNESS_SCOPE_GROUP       = 1;
  COMPACTNESS_SCOPE_PERSON      = 2;
}

// SOFT. Once a lecturer holds one Session of a recurring Offering, they
// should hold the rest of it too — not switch week to week. Built: an
// aggregate over an entire Offering's Sessions across the WHOLE TERM, keyed
// by Offering rather than Group, priced against `max(0, distinct_lecturers -
// required_lecturer_count)`. Only ever fires for an Offering with a genuine
// lecturer pool (`candidate_lecturer_ids.len() > required_lecturer_count`) —
// see solver ADR-0026.
message LecturerConsistency {}

// SOFT. Prices an Offering tagged `SCHEDULING_PATTERN_DISTRIBUTED` for
// spreading its Sessions across more than one weekly `(weekday, block)` slot.
// Cost: distinct weekly slots occupied, minus one. An Offering tagged BLOCK
// or UNSPECIFIED is untouched.
message DistributedPatternAdherence {}

// SOFT. Prices an Offering tagged `SCHEDULING_PATTERN_BLOCK` for spreading its
// Sessions across a wide span of the Term instead of a short window. Cost:
// idle WEEKS between the Offering's first and last placed week. An Offering
// tagged DISTRIBUTED or UNSPECIFIED is untouched.
message BlockPatternAdherence {}

// ---------------------------------------------------------------------------
// P2 batch: room fit, day/week aggregates, tenant-wide policy
// ---------------------------------------------------------------------------

// SOFT. Penalize seating an Offering in a Room much larger than its
// `min_capacity`. Severity is graded by RATIO (`capacity / min_capacity`), not
// raw seat-count distance. `min_capacity == 0` is never penalized: a ratio
// against zero is meaningless.
message MinimizeCapacityWaste {
  // Ratio at or above which a Room counts as wasteful for this Offering.
  double waste_ratio_threshold = 1;
}

// SOFT. Discourage occupying a Room marked `Room.is_specialized` with
// teaching that does not need what makes it specialized — so a lab, computer
// room or workshop stays free for the Sessions that genuinely require it.
//
// EXEMPT BY REQUIREMENT, not by configuration. A placement costs nothing when
// the Offering's `required_room_features` / `room_feature_requirements`
// intersect that Room's `feature_tags`: the programming class in the computer
// lab is exactly where it should be, and charging it would be noise on the
// objective at best and would push it out of its only suitable Room at worst.
// Only teaching that could have gone elsewhere is discouraged. This reads
// data the tenant already maintains for room ELIGIBILITY, so it needs no
// second list to keep in sync.
//
// NOT `MinimizeRoomRank`, deliberately, though both "keep certain rooms
// free". `rank` is an ORDINAL desirability scale whose `invert` mode means
// "prefer the premium rooms" — encoding a lab as high-rank would make that
// policy pull Sessions INTO the lab, and would make "spare the lab but prefer
// the auditorium" unrepresentable. Scarce-by-function and premium-by-
// desirability are different axes, which is what earns a second type under
// solver ADR-0024's one-type-per-axis rule.
//
// FLAT, charged at most ONCE per placement — the mark is a boolean, so there
// is no gradient to grade, unlike `MinimizeCapacityWaste`'s ratio or
// `MinimizeRoomRank`'s distance past its threshold. A Session occupying
// several specialized Rooms at once still costs its weight once.
message MinimizeSpecializedRoomUse {}

// SOFT. Penalize a Group's or Person's day touching more than
// `max_locations_per_day` distinct, non-empty `Room.location` values —
// reduces cross-campus walking between back-to-back Sessions.
//
// `Room.location` is opaque free text; a tenant is responsible for consistent
// values.
message MinimizeLocationChange {
  repeated CompactnessScope scope = 1; // empty = both axes independently

  // A day counts as a violation once it touches MORE than this many distinct
  // locations.
  uint32 max_locations_per_day = 2;
}

// SOFT. Caps how many blocks in a row a Group or Person can be scheduled
// without a break — the mirror image of `Compactness`, which minimizes the
// GAPS inside a day instead of the DENSITY of a run. A tenant may enable both,
// at different weights.
message MaxConsecutiveBlocks {
  repeated CompactnessScope scope = 1; // empty = both axes independently

  // A run longer than this many consecutive occupied blocks is penalized,
  // per block past the cap.
  uint32 max_consecutive = 2;
}

// SOFT. Caps how many Sessions (or blocks) a lecturer teaches in one week;
// priced once the cap is exceeded rather than refused (a hard cap on a count
// that only becomes fully known as placements accumulate risks the same
// dead-end-construction problem ADR-0025 records for `MaxOnlineShare`).
//
// Distinct from `LecturerVeto` (blocks specific time WINDOWS) and
// `LecturerConsistency` (same lecturer across an Offering's Sessions):
// neither caps total weekly load.
message MaxWeeklyTeachingLoad {
  // Count SESSIONS if false, BLOCKS if true.
  bool count_blocks = 1;

  uint32 max_per_week = 2;
}

// SOFT. Penalizes a Group sitting two or more exam-kind Sessions on the same
// day. Distinct from `MinimizeExamWeek`, which is about lessons avoiding (or
// seeking) the exam period AS A WHOLE. Which Sessions count as exam-kind is
// `ConstraintConfig.applies_to_kinds` on the enclosing config. See
// `ExamSpacingWindow` for the "within N days" sibling.
message ExamSpacingSameDay {}

// SOFT. Penalizes a Group sitting two exam-kind Sessions within
// `min_days_between` calendar days of each other. A separate type rather than
// a parameter on `ExamSpacingSameDay`, so the simple same-day rule pays no
// window-tracking cost.
message ExamSpacingWindow {
  // 1 asks the same question `ExamSpacingSameDay` does; above 1 additionally
  // spaces out near neighbors.
  uint32 min_days_between = 1;
}

// HARD. A tenant-wide reserved window (lunch, assembly, chapel) where no
// Session of the applying `kind`s may ever be placed — independent of any
// Person's or Group's own data. Enforced in `is_free`, not priced: a
// protected slot is never freed by placing something elsewhere, so there is
// no dead-end-construction problem the way `MaxOnlineShare` has.
message ProtectedBlock {
  repeated BlockedWindow windows = 1;
}

// A recurring-weekly or one-off blocked window — the same day/block/week
// vocabulary as `model.proto`'s `Unavailability`, kept as its own message
// rather than imported (constraints.proto must not depend on model.proto,
// which already imports constraints.proto). Same "empty axis = every value"
// convention.
message BlockedWindow {
  repeated uint32 days   = 1;  // ISO weekday. Empty = every day.
  repeated uint32 blocks = 2;  // 0-based within day. Empty = every block.

  // Index into the Academic Calendar's weeks. Empty = every week (recurring).
  // Non-empty = a one-off block, only in the named week(s).
  repeated uint32 weeks = 3;
}

// SOFT. An Offering's recurring Sessions should reuse the same Room each week
// rather than bouncing around — mirrors `LecturerConsistency` for the Room
// axis, but with no prerequisite blocker (Room assignment is not gated behind
// pool selection).
//
// "Usual" Room is the Offering's MODAL Room among its currently placed
// Sessions — recomputed as placements change. Every Session in a different
// Room is charged the constraint's weight once.
message RoomConsistency {}

// SOFT. Caps how many DISTINCT Rooms a Group uses across a whole WEEK — the
// "home room" concept: mostly one Room, with an occasional special-purpose
// exception. Distinct from `MinimizeLocationChange` (building-hopping WITHIN
// a day): this is total Room variety across the week.
message MinimizeRoomChurn {
  // A week touching more than this many distinct Rooms is penalized, per Room
  // past the cap.
  uint32 max_rooms_per_week = 1;
}

// SOFT. Caps the elapsed time from a Group's or Person's first to last
// Session in a day — distinct from `Compactness` (GAPS inside the span) and
// `MaxConsecutiveBlocks` (DENSITY): a day can have zero gaps and low density
// and still run far too long if the bracketing Sessions are simply far apart.
message MaxDailySpan {
  repeated CompactnessScope scope = 1; // empty = both axes independently

  // Blocks past which a day's first-to-last span is penalized, per block
  // past the cap.
  uint32 max_span_blocks = 2;
}

// SOFT. Caps a raw Session COUNT per day for a Group and/or a Person — the
// volume-limit sibling of `MaxDailySpan` (elapsed time) and
// `MaxConsecutiveBlocks` (continuity): a day can satisfy both of those and
// still be overloaded (e.g. 6 lessons split 3 + gap + 3). Priced once the
// cap is exceeded rather than refused, the same reasoning
// `MaxWeeklyTeachingLoad` and ADR-0025 give: a hard cap on a count only
// fully known as placements accumulate risks the same dead-end-construction
// problem.
message MaxDailySessionCount {
  repeated CompactnessScope scope = 1; // empty = both axes independently

  // Sessions past which a day is penalized, per Session past the cap.
  uint32 max_per_day = 2;
}

// ---------------------------------------------------------------------------
// The (Offering, day) cluster
//
// Three rules reduce the same cell — one Offering's occupied blocks within
// one day — three different ways: a raw Session count, the longest
// consecutive run, and the number of separated runs. Distinguishes an
// intentional multi-block Session (`Offering.duration_blocks`, one
// placement) from several separate Sessions landing consecutively (or
// split apart) by accident. All SOFT, priced once exceeded rather than
// refused — the same ADR-0025 reasoning `MaxDailySessionCount` gives.
// ---------------------------------------------------------------------------

// Caps a raw Session COUNT of one Offering on one day — "Maths, 4x a week"
// means four different days unless a tenant says otherwise.
message MaxOfferingSessionsPerDay {
  // Sessions past which a day is penalized, per Session past the cap.
  uint32 max_per_day = 1;
}

// Caps how many blocks of one Offering may run back to back in a day.
message MaxConsecutiveOfferingBlocks {
  // Blocks past which a run is penalized, per block past the cap.
  uint32 max_consecutive = 1;
}

// Prices the number of non-contiguous runs of one Offering's Sessions
// within a day, minus one — zero for a single run (including a lone
// Session). NOT the same question `Compactness` asks: a day packed solid
// with unrelated teaching in between two runs of the same Offering has
// zero gaps and still splits it.
message MinimizeOfferingDaySplit {}

// SOFT. Spreads a Group's Sessions evenly across its active days rather than
// clustering. Measured as the VARIANCE of per-day Session counts across
// active days, for one (Group, week) at a time — distinct from
// `MinimizeDayUsage`, which targets specific NAMED weekdays regardless of
// what else that Group has that week.
message MinimizeWeekdayImbalance {
  // FIELD 1 RESERVED — variance is read straight off `TimeGrid.active_days`,
  // no tenant parameter needed. Reserved for a future tuning knob.
  reserved 1;
}

// SOFT. Requires a minimum gap between two bookings of the SAME Room, even
// when the slot grid would otherwise allow them back-to-back — labs needing
// equipment reset, or setup/teardown time. Priced rather than refused, since
// HARD would risk making an instance needlessly harder to solve. Never
// crosses a week boundary.
message RoomTurnaroundBuffer {
  // Minimum blocks that must separate two bookings of the same Room.
  uint32 buffer_blocks = 1;
}

// HARD. Caps how many Sessions can be online AT THE SAME SLOT, tenant-wide —
// models a real platform limit (e.g. a Zoom/Teams license seat count),
// distinct from `MaxOnlineShare`'s per-Group RATIO over a time window. CAN be
// a filter (unlike MaxOnlineShare): the count at one slot has no
// moving-denominator problem, so it is enforced in `is_free` like
// `RoomDoubleBooking`.
//
// The cap lives here, not on `Room.capacity` — a virtual Room has no capacity
// concept (ADR-0022), and this models a platform-wide seat limit, not a
// Room's own property.
message MaxConcurrentOnlineSessions {
  uint32 max_concurrent = 1;
}

// HARD (validation-shaped, not a preference). Cross-checks the assigned
// Room's capacity against the actual attending Groups' `Group.size`, rather
// than trusting `Offering.min_capacity` alone — a safety net against stale or
// wrong input data. No parameters: the values already exist on the wire; this
// only switches the cross-check on.
message GroupSizeFitsRoom {}

// ---------------------------------------------------------------------------
// P0 batch: break-aware, per-Offering teaching mode, travel, day caps
// ---------------------------------------------------------------------------

// SOFT. Discourages a Session from spanning a `TimeGrid` break — starting
// before a gap and resuming after it, unless the alternative costs more.
// No parameters: cost depends only on the placement's own start block and
// duration against `TimeGrid.default_gap_minutes`/`breaks`, already on the
// wire.
//
// Reverses the app's "a Session whose duration spans a break" decision,
// which held such placements legal and NOT sent to the solver — recorded
// there, not here, because the reversal is app-side documentation, this
// type existing is the reversal.
message MinimizeBreakSpanning {}

// SOFT. Prices the number of DISTINCT DAYS one Offering's Sessions land on
// across the whole term, for Offerings with `Offering.prefer_fuller_days`
// set. Independent of `scheduling_pattern` (WHEN in the term) and of the
// (Offering, day) cluster above (WITHIN one day) — combines with
// `BlockPatternAdherence`: BLOCK + this means a short, dense run of full
// days. No parameters: which Offerings are counted is entirely
// `Offering.prefer_fuller_days`.
message MinimizeOfferingDistinctDays {}

// SOFT. Requires a minimum gap when consecutive same-day Sessions for the
// same Person or Group are in Rooms whose `Room.site` differs — modeling
// travel between buildings/campuses. Priced against the ACTUAL gap between
// the two blocks (`TimeGrid.default_gap_minutes`/`breaks`), not block
// adjacency alone; two Rooms with no site set are treated as co-located.
// Only same-day, adjacent-block pairs are considered — not the full
// pairwise cross-product `Ordering between Offerings` would need.
message TravelTimeBetweenRooms {
  repeated CompactnessScope scope = 1; // empty = both axes independently

  uint32 min_minutes_between_sites = 2;
}

// HARD, priced at `hard_penalty` rather than a construction filter — the
// same ADR-0025 stance `MaxOnlineShare` takes, since Calendry's warn-and-allow
// design must not let a hard day cap dead-end construction. Caps the number
// of DISTINCT days one Group's or Person's Sessions may use, per week.
message MaxDays {
  repeated CompactnessScope scope = 1;

  uint32 max_days = 2;
}

// HARD, same pricing stance as `MaxDays`. Caps the longest run of
// CONSECUTIVE active days (per `TimeGrid.active_days`) one Group or Person
// may be scheduled on, per week.
message MaxConsecutiveDays {
  repeated CompactnessScope scope = 1;

  uint32 max_consecutive_days = 2;
}

// SOFT. Requires minimum WALL-CLOCK rest between one day's last active
// block and the next TEACHING day's first active block (consecutive per
// `TimeGrid.active_days`, NOT calendar-adjacent — a Friday-to-Monday gap
// trivially satisfies any reasonable rest period), for the same Group or
// Person. Resolves through `TimeGrid.day_start_minute`/
// `block_length_minutes`/`default_gap_minutes`/`breaks` for the real
// end/start minute, not a block count — the same reasoning
// `TravelTimeBetweenRooms` prices the actual gap rather than adjacency.
message Daybreak {
  repeated CompactnessScope scope = 1;

  uint32 min_rest_minutes = 2;
}

// ---------------------------------------------------------------------------
// Offering relations
//
// A whole family of requested rules — Precedence, DifferentTime, SameTime/
// SameDays/SameStart, MeetTogether/CanShareRoom, and the "N hours between"
// variants — needs a pointer no `ConstraintConfig` field can hold: a
// reference to SPECIFIC Offerings, not a category. `applies_to_kinds` names a
// kind; these rules name Offering `db-lecture` and Offering `db-lab`.
//
// One mechanism for all of them: an ORDERED set of Offering references, a
// relation type, and that type's own parameters. Only the evaluator differs
// between relation types. See solver ADR-0028 for the full reasoning,
// including why this is a NEW top-level message rather than another
// `ConstraintConfig.params` variant, and why `offering_ids` is ordered even
// though only a few future relation types (Precedence, Next Day, Two Days
// After) ever read that order.
// ---------------------------------------------------------------------------

message OfferingRelation {
  string id = 1;

  bool enabled = 2;

  // Meaningful for SOFT relation types only; ignored for HARD types.
  double weight = 3;

  // Which Offerings this relation relates, in the tenant's stated order.
  // Symmetric types (`DifferentTime`) ignore the order.
  //
  // A dangling id here is a structural error, not a feasibility one (see
  // `ConvertError::UnknownOffering`): a relation silently missing one of its
  // own operands would enforce a DIFFERENT rule than the one configured, not
  // a looser version of the same one.
  repeated string offering_ids = 4;

  oneof params {
    DifferentTime different_time = 10;
    SameTime      same_time      = 11;
    SameDays      same_days      = 12;
    SameStart     same_start     = 13;
    MeetTogether  meet_together  = 14;
    Precedence    precedence     = 15;
  }
}

// HARD. No two members of the enclosing relation may ever share a slot — the
// same shape as `RoomDoubleBooking`, keyed by relation membership instead of
// by Room. Symmetric: `OfferingRelation.offering_ids`' order is irrelevant.
// No parameters: which Offerings are related is entirely the enclosing
// `OfferingRelation.offering_ids`.
message DifferentTime {}

// ---------------------------------------------------------------------------
// SameTime / SameDays / SameStart — force members to run in PARALLEL rather
// than apart. The opposite of `DifferentTime`, and not interchangeable with
// each other: each binds a different axis, and a tenant wants them
// separately (parallel streams in the same hour vs. classes that must
// merely share their day pattern).
//
// PER-WEEK, BEST-EFFORT: none of the three requires the related Offerings
// to share `required_session_count`. For each week where two or more
// members have a placed Session, THOSE Sessions must agree on the bound
// axis; a week where only one member (or none) has a Session imposes no
// constraint that week. This sidesteps the "one meets twice a week, the
// other three times" ill-definedness the relation would otherwise inherit
// from `ExactFrequency` mismatches, at the cost of never flagging a week
// that is one-sided by construction rather than by mismatch — accepted
// because Calendry Sessions are placed per-week independently, with no
// fixed weekly "meeting pattern" object UniTime's own class-level relations
// assume.
//
// All HARD, matching `DifferentTime`'s precedent for this mechanism — the
// search cannot violate any of the three. No parameters: which Offerings
// are related, and which weeks their Sessions land in, are read entirely
// off the enclosing `OfferingRelation.offering_ids` and each Session's own
// `SlotRef`.
// ---------------------------------------------------------------------------

// HARD. Members' same-week Sessions must occupy the same block — same time
// of day, days may differ.
message SameTime {}

// HARD. Members' same-week Sessions must occupy the same day — the weekday
// set matches, blocks may differ.
message SameDays {}

// HARD. Members' same-week Sessions must START at the same block — the
// strict combination of `SameTime` and `SameDays` collapsed into one direct
// check, kept as its own type (rather than requiring a tenant to enable
// both) because UniTime's `Same Start Time` is requested independently.
message SameStart {}

// HARD. The full UniTime "Meet Together" package: every member of the
// enclosing relation shares ONE Room, at one same-week SameTime+SameDays
// slot, simultaneously — cross-listed courses, a combined lecture for two
// programmes, a joint seminar. Composes SameTime+SameDays semantics with
// CONDITIONAL room sharing rather than duplicating them: the room axis
// treats members of a `MeetTogether` relation as one combined occupant for
// that Room at that slot, summing `Offering.min_capacity` across them,
// instead of each excluding the other the way `RoomDoubleBooking` normally
// would. Every other pair of Offerings is still refused the room — this
// relaxes exclusivity for exactly the declared members, not the Room.
//
// `CanShareRoom` (UniTime's weaker variant: room-sharing only, no time
// constraint) is deliberately not built here — nothing has requested it
// independently of the full package, and it would need its own answer to
// what "sharing" means without SameTime/SameDays binding the pair together.
message MeetTogether {}

// ---------------------------------------------------------------------------
// Precedence — a lab must follow its lecture. The FIRST relation type that
// reads `OfferingRelation.offering_ids`' ORDER (ADR-0028 kept the set ordered
// for exactly this): the members form a CHAIN, and the rule binds each
// consecutive pair `(offering_ids[i], offering_ids[i+1])`.
//
// TERM-WIDE, ALL PAIRS: every placed Session of the predecessor must end
// before every placed Session of the successor begins. This is the
// block-teaching reading — all lectures finish before any lab starts — not a
// per-week pairing, and NOT UniTime's "first meeting of the first class"
// either. Both alternatives were considered and rejected: a per-week pairing
// says nothing about a lab in week 2 preceding a lecture in week 3, and
// first-meetings-only leaves every occurrence after the first unconstrained.
//
// Because "all pairs ordered" reduces to a single comparison — the
// predecessor's LATEST end against the successor's EARLIEST start — that one
// boundary is also where both parameters below are measured. There is exactly
// one gap per consecutive member pair, not one per Session pair.
//
// HARD, but PRICED at `hard_penalty` rather than enforced as a candidate
// filter, the same stance `SameTime`/`SameDays`/`SameStart` and
// `MaxDays`/`MaxConsecutiveDays` take: the boundary depends on the extremes of
// two Offerings' COMPLETE placed sets, which no mid-search moment has. A run
// can therefore SUCCEED while reporting a `PrecedenceRelation` violation.
//
// BEST-EFFORT on the unplaced side: a member with no placed Session at all
// imposes nothing on the boundaries it participates in — the same answer
// `SameTime`'s per-week stance gives, and the one issue #37 required be
// stated rather than left to throw or silently score zero.
message Precedence {
  // Wall-clock minutes required between the predecessor's last Session
  // ENDING and the successor's first Session STARTING, resolved through the
  // TimeGrid (block lengths, the default gap and every named break), never
  // counted in blocks. 0 = back-to-back is fine, but the ordering itself
  // still holds: the successor may not start before the predecessor ends.
  //
  // Use this for "the lab must be at least a day after the lecture"
  // (`1440`); it is the same wall-clock notion `Daybreak.min_rest_minutes`
  // and `TravelTimeBetweenRooms` already use.
  uint32 min_gap_minutes = 1;

  // Ceiling on the same boundary, in CALENDAR days: the successor's first
  // Session may start at most this many days after the day of the
  // predecessor's last. 0 = unbounded, which is the "same week or later,
  // whenever" reading. Set to 7 for "within a week of the lecture".
  //
  // Calendar days, deliberately, not teaching days — a Friday-to-Monday
  // boundary is 3 days here, not 1. A tenant stating "within 2 days" means
  // the student's calendar, and counting teaching days would silently
  // stretch that across every weekend and closure week.
  uint32 max_days_between = 2;
}
