// Calendry solver — problem snapshot.
//
// The solver never touches Postgres. The Nuxt app assembles a SolverInput
// snapshot and sends it over gRPC; the solver is stateless and
// input/output-only.
//
// Two-level scheduling model:
//   Offering = the DEMAND definition ("this needs to happen N times, needs a
//              Lecturer with role X, a Group, a Room with equipment Y, kind Z").
//              This is the solver's input.
//   Session  = one atomic PLACED instance (week/slot/room/lecturer/group).
//              This is the solver's output.

syntax = "proto3";

package calendry.solver.v1;

import "calendry/solver/v1/constraints.proto";

// ---------------------------------------------------------------------------
// Root snapshot
// ---------------------------------------------------------------------------

message SolverInput {
  string requesting_tenant_id = 1;

  // Empty if the tenant belongs to no Federation.
  string federation_id = 2;

  TimeGrid         time_grid = 3;
  AcademicCalendar calendar  = 4;

  repeated Room     rooms     = 5;
  repeated Person   persons   = 6;
  repeated Group    groups    = 7;
  repeated Offering offerings = 8;

  // Already-placed Sessions. Includes Sessions the solver may move (in scope),
  // must not move (locked / past / out of scope), and Federation-owned Sessions
  // that act purely as occupancy.
  repeated Session existing_sessions = 9;

  // Occupancy of Federation-shared Rooms by OTHER tenants.
  repeated ExternalOccupancy external_occupancy = 10;

  repeated ConstraintConfig constraints = 11;

  // The caller-supplied "now". Sessions starting strictly before this slot are
  // excluded from recalculation entirely — a correctness rule, not a preference.
  //
  // Supplied by the caller rather than read from the server clock so that a run
  // is deterministic and replayable: re-running the same snapshot tomorrow must
  // produce the same answer.
  SlotRef reference_slot = 12;
}

// ---------------------------------------------------------------------------
// Time
// ---------------------------------------------------------------------------

// Per-tenant configured grid. There is NO global fixed grid: any arithmetic
// like "slot % 3 = the day" or "slot > 14 means Saturday" is forbidden and must
// resolve against this message instead.
message TimeGrid {
  uint32 blocks_per_day       = 1;
  uint32 block_length_minutes = 2;

  // Minutes from midnight, institution-local.
  uint32 day_start_minute = 3;

  // ISO weekday, 1 = Monday .. 7 = Sunday.
  repeated uint32 active_days = 4;

  // IANA zone of the institution. Informational only — all solving happens in
  // single institution-local time. Per-Person timezone is a presentation/export
  // concern and must never reach "same day" / "adjacent slot" logic.
  string institution_timezone = 5;
}

// Addresses one block of the grid. Deliberately a struct rather than a flat
// integer: a bare index silently misinterprets against a different grid, and
// this service must never assume a grid shape.
message SlotRef {
  // Index into AcademicCalendar.weeks.
  uint32 week = 1;

  // ISO weekday, 1 = Monday .. 7 = Sunday.
  uint32 day = 2;

  // 0-based within the day.
  uint32 block = 3;
}

message AcademicCalendar {
  string term_id = 1;

  repeated Week weeks = 2;

  // Single days that are holidays inside otherwise-teaching weeks.
  repeated Holiday holidays = 3;
}

message Week {
  uint32 index = 1;

  // ISO-8601 date (YYYY-MM-DD) of that week's Monday.
  string start_date = 2;

  WeekKind kind = 3;
}

// Enum values carry the enum-name prefix because protobuf scopes them to the
// enclosing PACKAGE, not to the enum. Unprefixed `EXAM` / `BREAK` would occupy
// `calendry.solver.v1` directly and collide with any future enum wanting the
// same word — a protoc error, not a warning.
enum WeekKind {
  WEEK_KIND_UNSPECIFIED = 0;
  WEEK_KIND_TEACHING    = 1;
  WEEK_KIND_EXAM        = 2;
  WEEK_KIND_BREAK       = 3;
  WEEK_KIND_HOLIDAY     = 4;
}

message Holiday {
  // ISO-8601 date (YYYY-MM-DD).
  string date  = 1;
  string label = 2;
}

// ---------------------------------------------------------------------------
// Space
// ---------------------------------------------------------------------------

message Room {
  string id = 1;

  // Mirrors the DB invariant: tenant_id / federation_id both nullable,
  // exactly one set. The oneof makes the alternative unrepresentable.
  oneof owner {
    string tenant_id     = 2;
    string federation_id = 3;
  }

  string name     = 4;
  uint32 capacity = 5;

  // Desirability. HIGHER = more premium / scarce. MinimizeRoomRank penalizes
  // rooms at or above its threshold.
  uint32 rank = 6;

  // Online delivery is modeled as a virtual Room rather than a boolean flag on
  // the Session, so room-assignment logic stays uniform.
  bool is_virtual = 7;

  // Tenant-defined equipment/feature vocabulary. PRESENCE only — a Room either
  // carries a feature or does not. See `feature_quantities` for a feature this
  // Room carries several units of.
  repeated string feature_tags = 8;

  string location = 9;

  // How many units of a feature this Room supplies, for features where a
  // COUNT matters (e.g. "workstation": 24) rather than mere presence.
  //
  // PROTO ONLY — the solver does not yet match `Offering.
  // room_feature_requirements.min_quantity` against this; eligibility still
  // checks `feature_tags` membership alone. A feature named here SHOULD also
  // appear in `feature_tags`, since existing tenant-facing eligibility
  // (`required_room_features`) reads only `feature_tags` and is not being
  // changed by this field.
  repeated RoomFeatureQuantity feature_quantities = 10;
}

// One counted feature a Room supplies. See `Room.feature_quantities`.
message RoomFeatureQuantity {
  string feature  = 1;
  uint32 quantity = 2;
}

// ---------------------------------------------------------------------------
// People & grouping
// ---------------------------------------------------------------------------

message Person {
  string id = 1;

  // Tenant-defined vocabulary. "lecturer" is the one fixed, universal role.
  repeated string role_tags = 2;

  repeated string group_ids = 3;

  repeated Unavailability blackouts = 4;

  // Soft. EMPTY MEANS NO PREFERENCE — the opposite of Unavailability below,
  // where an empty repeated field means "every value on that axis". The two are
  // structurally identical and semantically inverted, which is exactly why they
  // are separate messages rather than one reused type.
  Preference preferred = 5;
}

// A soft preference: days and blocks this person would RATHER have, weighted
// against the tenant's other soft rules rather than enforced.
//
// NOT `Unavailability`, despite the identical shape. That message means "every
// value on this axis" when a field is empty; here empty means "no preference at
// all". Reusing it would put the inversion one refactor away from being lost,
// and the app's own schema carries the same warning about its two tables.
//
// No `weeks` field: a preference is a recurring weekly shape, not a dated
// absence. Additive later if that turns out to be wanted.
message Preference {
  repeated uint32 days   = 1;  // ISO weekday, 1 = Monday
  repeated uint32 blocks = 2;  // 0-based within day

  // Bounded per-person override of the tenant's person_preference_fit weight,
  // clamped by the app to [0.5, 2.0].
  //
  // `optional` for REAL FIELD PRESENCE, and that is load-bearing rather than
  // stylistic: proto3's zero default is itself a meaningful multiplier (0 would
  // mean "ignore this person entirely"), so a plain double could not distinguish
  // "no override" from "count them at zero". The app validates the range and the
  // database enforces it again; a reader should still clamp defensively, since
  // this service accepts possibly-invalid input by design.
  optional double weight_multiplier = 3;

  // Room-type preference: features this Person would prefer their placements'
  // Room to carry. Empty = no room-type preference stated — additive on the
  // same "no preference" reading as an empty `days`/`blocks`.
  //
  // References `Room.feature_tags`' vocabulary by KEY, not by an id: matches
  // what already crosses the wire for `Offering.required_room_features`, and
  // survives an Equipment row being re-keyed only if the app updates the
  // string here too — a deleted/renamed Equipment leaves a stale string that
  // is inert rather than wrong, the same tradeoff already accepted for room
  // requirements.
  //
  // PROTO ONLY — no evaluator reads this yet. `PersonPreferenceFit` counts
  // `days`/`blocks` only; widening it to this axis is solver-side work, not a
  // second wire change, since this rides the same tenant-level switch.
  repeated string preferred_room_features = 4;
}

// A blackout window. Empty repeated field = "all values on that axis", so
// {days:[5]} means every Friday and {blocks:[0]} means every first block.
message Unavailability {
  repeated uint32 days   = 1;  // ISO weekday
  repeated uint32 blocks = 2;  // 0-based within day
  repeated uint32 weeks  = 3;  // index into calendar weeks

  string reason = 4;
}

// Nested. The ancestor/descendant closure is NOT transmitted — the solver
// derives it from parent_id. Shipping the app's closure table would create a
// second source of truth that can drift with no way for the solver to detect it.
message Group {
  string id        = 1;
  string parent_id = 2;  // empty = root
  string name      = 3;
  uint32 size      = 4;

  // Periods this Group is NOT available, same message and same "empty axis =
  // every value on that axis" rule as `Person.blackouts`. Enforced only when
  // the tenant enables `GroupVeto`; the VALUES are Group data, the switch is
  // tenant policy.
  //
  // NEGATIVE, while the app stores the POSITIVE. A tenant sets "this cohort
  // runs weeks 1-6 of the Term" — a date range inside one Term — and the app
  // inverts it to the complementary week indices at assembly. The inversion is
  // deliberate and one-directional: reusing `Unavailability` keeps one
  // convention for absence across Person and Group, and keeps the solver's
  // existing slot-blocking machinery rather than adding a second, opposite one
  // (see the note on `Preference` above for what happens when two
  // structurally-identical messages mean opposite things).
  //
  // INHERITS DOWNWARD. A blackout on a Group applies to that Group and its
  // DESCENDANTS: a programme unavailable in a period means every cohort inside
  // it is too. It does NOT propagate upward — a leaf cohort's absence must not
  // block its parent's lecture, which the parent's other children still
  // attend. Note this is the opposite direction from the conflict closure,
  // which flows both ways; getting it backwards would let one seminar's break
  // veto a whole faculty's timetable, and looks correct on any flat fixture.
  repeated Unavailability blackouts = 5;
}

// ---------------------------------------------------------------------------
// Scheduling
// ---------------------------------------------------------------------------

message Offering {
  string id = 1;

  oneof owner {
    string tenant_id     = 2;
    string federation_id = 3;
  }

  // Tenant-defined vocabulary, replacing any fixed Lecture/Exam/Event split.
  string kind = 4;

  // The "N times" — how many Sessions must realize this Offering.
  uint32 required_session_count = 5;

  uint32 duration_blocks = 6;

  // One shape covering two cases: when candidate_lecturer_ids.len() ==
  // required_lecturer_count the assignment is fixed; otherwise the solver is
  // choosing from a pool.
  repeated string candidate_lecturer_ids = 7;
  uint32          required_lecturer_count = 8;

  repeated string group_ids = 9;

  // Directly-assigned individuals, independent of Group membership.
  repeated string participant_person_ids = 10;

  // PRESENCE only — matched against `Room.feature_tags`. See
  // `room_feature_requirements` for a feature that needs a minimum COUNT
  // (e.g. "needs 24 workstations"), which this field cannot express: it can
  // only ask that a Room carry a workstation, not how many.
  repeated string required_room_features = 11;
  uint32          min_capacity           = 12;

  // Empty = any eligible Room.
  repeated string allowed_room_ids = 13;

  bool allow_online = 14;

  // Room requirements that carry a minimum COUNT, alongside the
  // presence-only `required_room_features` above. Both apply when both are
  // set — this is an addition, not a replacement.
  //
  // PROTO ONLY — the solver's room-eligibility filter does not read this yet;
  // it checks `required_room_features` against `Room.feature_tags` only.
  repeated RoomFeatureRequirement room_feature_requirements = 15;

  // How many Rooms one Session of this Offering must occupy SIMULTANEOUSLY.
  // 0 and 1 both mean today's single-room behavior; the solver has never had
  // a reason to distinguish "unset" from "one".
  //
  // PROTO ONLY — the solver assigns exactly one Room to every placement
  // regardless of this field; a value above 1 is accepted and silently not
  // honoured until the search gains a multi-room placement primitive. See
  // `Session.room_ids` / `PlacedSession.room_ids` for the matching output
  // shape, staged the same way.
  uint32 required_room_count = 16;

  // How this Offering's demand should distribute across the Term.
  // UNSPECIFIED (the default) is untouched by either enforcing constraint
  // type, so an Offering that never sets this solves exactly as it always
  // has. See `DistributedPatternAdherence` / `BlockPatternAdherence` in
  // constraints.proto for the two dedicated constraint types that read it —
  // one per pattern, since the two patterns' cost functions share nothing.
  SchedulingPattern scheduling_pattern = 17;
}

// See `Offering.room_feature_requirements`.
message RoomFeatureRequirement {
  string feature = 1;

  // Absent = "must be present", no specific count — the same question
  // `required_room_features` already asks. Set = the Room must supply at
  // least this many units of `feature` (see `Room.feature_quantities`).
  //
  // `optional` for REAL FIELD PRESENCE: proto3's zero default cannot
  // distinguish "no minimum stated" from "needs zero", which is meaningless
  // for something REQUIRED — the same reasoning `Preference.weight_multiplier`
  // above is `optional` for.
  optional uint32 min_quantity = 2;
}

// How an Offering's demand distributes across the Term. See
// `Offering.scheduling_pattern`.
enum SchedulingPattern {
  SCHEDULING_PATTERN_UNSPECIFIED = 0;

  // A consistent weekly slot for the whole Term. Today's implicit behavior:
  // nothing currently enforces it, so the solver may in principle place each
  // week's occurrence independently.
  SCHEDULING_PATTERN_DISTRIBUTED = 1;

  // The whole demand concentrated into a short contiguous window, rather than
  // spread one-per-week across the Term.
  SCHEDULING_PATTERN_BLOCK = 2;
}

message Session {
  string id = 1;

  oneof owner {
    string tenant_id     = 2;
    string federation_id = 3;
  }

  // May be empty: ad-hoc Sessions (e.g. a "staff_meeting" kind) need not
  // realize any Offering.
  string offering_id = 4;

  string kind = 5;

  SlotRef start_slot     = 6;
  uint32  duration_blocks = 7;

  // The PRIMARY Room, and the only one for a single-room Session. Stays
  // meaningful on its own for a Session using exactly one Room — a
  // multi-room Session ALSO fills `room_ids` with the complete set, `room_id`
  // included, so a reader that has not adopted the plural field still sees
  // one (the primary) Room rather than nothing.
  string          room_id      = 8;
  repeated string lecturer_ids = 9;
  repeated string group_ids    = 10;
  repeated string person_ids   = 11;

  // An explicit user lock. ABSOLUTE: never relaxed, not even by the deferred v2
  // minimize-movement policy.
  //
  // Distinct from being out of scope, which is merely expensive to violate.
  // Scope membership is NOT stored here — it comes from SolveScope.
  bool is_locked = 12;

  // The full set of Rooms this Session occupies simultaneously, `room_id`
  // included. Empty for an ordinary single-room Session — `room_id` alone is
  // already the complete answer there, so this is not populated redundantly.
  //
  // PROTO ONLY — see `Offering.required_room_count`, which this exists to
  // carry occupancy for. Meaningless input today: `partition_sessions`
  // reads only `room_id`, so a caller sending several here for an EXISTING
  // Session has every extra entry silently dropped, not honoured.
  repeated string room_ids = 13;
}

// ---------------------------------------------------------------------------
// Scope
// ---------------------------------------------------------------------------

// One solve mechanism, not multiple modes: a request names what is being
// actively placed, plus a policy for everything outside that.
message SolveScope {
  // Union of the two. Empty scope entirely = nothing to place.
  repeated string offering_ids = 1;
  repeated string group_ids    = 2;

  LockPolicy outside_scope_policy = 3;

  // Only meaningful under LOCK_POLICY_MINIMIZE_MOVEMENT; ignored otherwise.
  // Charged once, exactly like every other soft weight, when a moved
  // out-of-scope Session's slot OR room differs from where it already was —
  // a room-only change counts as "moved" too. Non-optional: 0 is a legitimate,
  // unambiguous state ("track disturbance but do not steer against it"), the
  // same reading every other soft weight gives a zero, so there is no
  // "unset vs zero" distinction to preserve.
  double minimize_movement_weight = 4;
}

enum LockPolicy {
  LOCK_POLICY_UNSPECIFIED = 0;

  // v1: everything outside scope is hard-locked and never moved.
  LOCK_POLICY_HARD = 1;

  // v2: a soft minimize-movement penalty replaces the hard lock, so the
  // solver MAY disturb out-of-scope Sessions when genuinely necessary but is
  // biased against it by `SolveScope.minimize_movement_weight`.
  LOCK_POLICY_MINIMIZE_MOVEMENT = 2;
}

// ---------------------------------------------------------------------------
// Federation-shared occupancy — OPEN DEPENDENCY
//
// How the app obtains this (cross-tenant occupancy ledger vs. a narrow database
// function) is undecided. This message is deliberately shaped to make no
// commitment either way: it carries only what the solver needs to avoid
// double-booking a shared Room across a tenant boundary.
// ---------------------------------------------------------------------------

message ExternalOccupancy {
  // Must reference a Federation-owned Room.
  string room_id = 1;

  SlotRef start_slot     = 2;
  uint32  duration_blocks = 3;

  // Opaque; diagnostics only. The solver never interprets this.
  string source_ref = 4;
}

// ---------------------------------------------------------------------------
// Output
// ---------------------------------------------------------------------------

message SolverOutput {
  // The full resulting placement for in-scope Sessions.
  repeated PlacedSession sessions = 1;

  // Hard-constraint violations surviving in the returned solution.
  //
  // The solver accepts possibly-infeasible input (the app's manual-edit UX is
  // "warn and allow") and degrades gracefully rather than rejecting it. How a
  // completed run whose output still contains violations should be CLASSIFIED
  // is a separate open question — deliberately not encoded here, so no
  // classification gets baked in by accident.
  repeated ConstraintViolation hard_violations = 2;

  ObjectiveBreakdown objective = 3;
  SolveStats         stats     = 4;

  // DRAFT — NOT COMMITTED. Additional alternative solutions to the SAME
  // request, for a caller to choose between rather than receiving one best
  // result. `sessions` / `hard_violations` / `objective` above are UNCHANGED
  // and remain the authoritative single result for every existing caller;
  // this is a purely additive, ignorable extra view.
  //
  // What is NOT decided here, and is exactly why this is marked draft: how
  // many candidates, how "genuinely different" is defined and enforced
  // (near-duplicates are useless), and whether the search can produce this
  // cheaply in one run or needs several. Shipping a field before those
  // questions are settled risks the field's shape being wrong for the answer
  // — recorded anyway because a wire shape has to exist for the design
  // conversation to react to, and reacting to a concrete shape is easier
  // than to a description of one.
  repeated SolverCandidate candidates = 5;
}

// One alternative full result. See `SolverOutput.candidates`.
message SolverCandidate {
  repeated PlacedSession       sessions        = 1;
  repeated ConstraintViolation hard_violations = 2;
  ObjectiveBreakdown           objective       = 3;
}

message PlacedSession {
  // Empty = newly created by this run.
  string session_id  = 1;
  string offering_id = 2;

  SlotRef start_slot     = 3;
  uint32  duration_blocks = 4;

  string          room_id      = 5;
  repeated string lecturer_ids = 6;
  repeated string group_ids    = 7;
  repeated string person_ids   = 8;

  // Stable within THIS response only, never across a re-solve: real
  // session_id when set, otherwise `offering_id` + "#" + occurrence for a
  // Session this run invented (occurrence is this run's internal placement
  // index, not anything the caller assigned). Exists so
  // `ConstraintViolation.session_ids` can name a Session this run created and
  // still have the caller resolve it back to a concrete entry in `sessions`
  // above — before this field, a violation naming an invented Session carried
  // a label that matched nothing else in the response, because `session_id`
  // on a new Session is deliberately empty. Not an identity scheme for the
  // Session across runs; once persisted, the caller's own session_id is what
  // a later run reuses.
  string placement_ref = 9;

  // The full set of Rooms this Session occupies, `room_id` included. Empty
  // for an ordinary single-room Session — see `Session.room_ids`, the input
  // counterpart, for why that is not redundant duplication.
  //
  // PROTO ONLY — never populated today: the solver assigns one Room per
  // placement, so this stays empty until `Offering.required_room_count` has
  // an evaluator.
  repeated string room_ids = 10;
}

message ConstraintViolation {
  string constraint_id   = 1;
  string constraint_type = 2;

  // Each entry equals some PlacedSession.placement_ref in the same response,
  // so a violation is always resolvable to a concrete Session — including one
  // this run invented, whose session_id is empty. See placement_ref's comment.
  repeated string session_ids  = 3;
  repeated string offering_ids = 4;

  // Human-readable; diagnostics only, never parsed.
  string detail = 5;
}

message ObjectiveBreakdown {
  double total = 1;

  repeated ComponentScore components = 2;
}

message ComponentScore {
  string constraint_id   = 1;
  string constraint_type = 2;

  uint64 raw_count = 3;
  double weighted  = 4;
}

message SolveStats {
  uint64 moves_evaluated = 1;
  uint64 moves_accepted  = 2;
  uint64 elapsed_millis  = 3;

  // e.g. "time_budget", "move_budget", "converged", "cancelled".
  string termination_reason = 4;
}
